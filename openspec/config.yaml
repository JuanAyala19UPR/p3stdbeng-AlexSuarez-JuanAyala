schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Do not scatter parameter error checks through the implementation; consolidate them in small private check helpers so the main flow stays readable."
      - "Favor simplicity and clarity over raw performance."
      - "Treat HeapFile as a fixed foundation - design on top of its existing format and API, never modify it; if a change to HeapFile seems needed, stop and ask the user."
      - "If a check fails, verify the underlying design first; never rewrite a test case just to make it pass."
      - "Do not change or re-test code that was already tested in a prior run - carry it and its existing tests forward unchanged, and add checks only for new behavior."
